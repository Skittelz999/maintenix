# Activate explicitly with SPRING_PROFILES_ACTIVE=prod.
# Production DB_URL must use sslmode=verify-full and sslrootcert pointing to
# a trusted CA bundle mounted in the container (see README).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}

server.port=${PORT:8080}
# Only expose the backend through a trusted proxy/load balancer.
# Tomcat handles X-Forwarded-For and X-Forwarded-Proto from trusted proxies.
# Terminate HTTPS and redirect public HTTP at the load balancer. Port 8080 is private.
# Keep Tomcat's trusted-proxy filtering; never set remoteip.internal-proxies empty.
server.forward-headers-strategy=native
server.tomcat.redirect-context-root=false

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# Only health and info are available; SecurityConfig restricts info to admins.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.info.access=read-only
management.endpoints.web.exposure.include=health,info
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
management.info.defaults.enabled=false
