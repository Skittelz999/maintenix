spring.application.name=maintenix

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15433/maintenix}
spring.datasource.username=${DB_USERNAME:maintenix}
spring.datasource.password=${DB_PASSWORD:maintenix}

app.jwt.secret=${JWT_SECRET:maintenix-development-jwt-secret-change-me-now}
app.jwt.expiration=${JWT_EXPIRATION:PT1H}
app.jwt.issuer=maintenix
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
