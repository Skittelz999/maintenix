spring.application.name=maintenix

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15433/maintenix}
spring.datasource.username=${DB_USERNAME:maintenix}
spring.datasource.password=${DB_PASSWORD:maintenix}

app.jwt.secret=${JWT_SECRET:maintenix-development-jwt-secret-change-me-now}
app.jwt.expiration=${JWT_EXPIRATION:PT1H}
app.jwt.issuer=maintenix
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Keep Actuator restricted in every profile.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.info.access=read-only
management.endpoints.web.exposure.include=health,info
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
management.info.defaults.enabled=false
