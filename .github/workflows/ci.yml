name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Run backend tests including Testcontainers
        run: ./mvnw test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24 LTS and npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend for production
        run: npm run build

  docker-build:
    name: Docker Build
    needs: backend-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build backend Docker image
        run: docker build -t maintenix-backend:ci ./backend

  ecr-publish:
    name: Publish Backend to ECR
    needs: [backend-tests, frontend-build, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Skittelz999/maintenix'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - name: Validate AWS repository variables
        shell: bash
        run: |
          for variable in AWS_ACCOUNT_ID AWS_REGION AWS_ROLE_ARN ECR_REPOSITORY; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Set the GitHub Actions repository variable ${variable}; see README AWS setup."
              exit 1
            fi
          done
          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || [[ "$AWS_ROLE_ARN" != "arn:aws:iam::${AWS_ACCOUNT_ID}:role/"* ]]; then
            echo "::error::AWS_ACCOUNT_ID must contain 12 digits and AWS_ROLE_ARN must belong to that account."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build backend image with commit SHA
        run: docker build -t "maintenix-backend:${GITHUB_SHA}" ./backend

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: GitHubActions-${{ github.run_id }}-${{ github.run_attempt }}
          unset-current-credentials: true
          translate-env-variables: false

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registries: ${{ vars.AWS_ACCOUNT_ID }}
          mask-password: 'true'

      - name: Push immutable commit tag
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        shell: bash
        run: |
          image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          digest=$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${GITHUB_SHA}" --query 'images[0].imageId.imageDigest' --output text)
          if [[ "$digest" == "None" ]]; then
            docker tag "maintenix-backend:${GITHUB_SHA}" "$image"
            docker push "$image"
            digest=$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=${GITHUB_SHA}" --query 'images[0].imageId.imageDigest' --output text)
          else
            echo "Commit tag already exists; retaining the previously published image."
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::ECR did not return a valid digest for the commit tag."
            exit 1
          fi
          {
            echo '### Backend image in ECR'
            printf 'Image: %s\n\n' "$image"
            printf 'Digest: %s\n' "$digest"
          } >> "$GITHUB_STEP_SUMMARY"
